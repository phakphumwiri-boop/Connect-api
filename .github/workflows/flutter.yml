name: Flutter CI
on:
  push:
    branches: [main]
    paths: ["flutter_app/**", ".github/workflows/flutter.yml"]
  pull_request:
    branches: [main]
    paths: ["flutter_app/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Connect-api Flutter source
        uses: actions/checkout@v4
        with:
          repository: phakphumwiri-boop/Connect-api
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        working-directory: flutter_app
        run: flutter create --platforms=android --project-name ish_app --org com.connectapi .
      - name: Enable local emulator HTTP for development
        working-directory: flutter_app
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); p.write_text(s.replace("<application", "<application android:usesCleartextTraffic=\"true\"", 1) if "android:usesCleartextTraffic" not in s else s)'
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Check formatting
        working-directory: flutter_app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Unit tests
        working-directory: flutter_app
        run: flutter test --reporter expanded
      - name: Build release APK
        working-directory: flutter_app
        run: flutter build apk --release
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-android-release-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  apple:
    name: Build iOS Simulator and macOS
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout Connect-api Flutter source
        uses: actions/checkout@v4
        with:
          repository: phakphumwiri-boop/Connect-api
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Apple platform projects
        working-directory: flutter_app
        run: flutter create --platforms=ios,macos --project-name ish_app --org com.connectapi .
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Check formatting
        working-directory: flutter_app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Unit tests
        working-directory: flutter_app
        run: flutter test --reporter expanded
      - name: Build macOS release
        working-directory: flutter_app
        run: flutter build macos --release
      - name: Build iOS Simulator (no signing)
        working-directory: flutter_app
        run: flutter build ios --simulator --no-codesign
      - name: Upload Apple build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apple-builds
          path: |
            flutter_app/build/macos/Build/Products/Release/
            flutter_app/build/ios/iphonesimulator/
          if-no-files-found: error
          retention-days: 14
