name: Flutter CI
# Retry trigger: keep this workflow easy to re-dispatch after a GitHub Actions queue stall.

on:
  push:
    branches: [main]
    paths: ["flutter_app/**", ".github/workflows/flutter.yml"]
  pull_request:
    branches: [main]
    paths: ["flutter_app/**", ".github/workflows/flutter.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Flutter source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Apply Dart formatting
        working-directory: flutter_app
        run: dart format lib test
      - name: Verify Dart formatting
        working-directory: flutter_app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: flutter_app
        run: flutter analyze
      - name: Unit and widget tests
        working-directory: flutter_app
        run: flutter test --reporter expanded

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Android
            os: ubuntu-latest
            platform: android
            command: flutter build apk --release && flutter build appbundle --release
            artifact: |
              flutter_app/build/app/outputs/flutter-apk/app-release.apk
              flutter_app/build/app/outputs/bundle/release/app-release.aab
          - name: Web
            os: ubuntu-latest
            platform: web
            command: flutter build web --release
            artifact: flutter_app/build/web
          - name: Windows
            os: windows-latest
            platform: windows
            command: flutter build windows --release
            artifact: flutter_app/build/windows/x64/runner/Release
          - name: Linux
            os: ubuntu-latest
            platform: linux
            command: flutter build linux --release
            artifact: flutter_app/build/linux/x64/release/bundle
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Java for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native platform project
        working-directory: flutter_app
        run: flutter create --platforms=${{ matrix.platform }} --project-name ish_app --org com.connectapi .
      - name: Install dependencies
        working-directory: flutter_app
        run: flutter pub get
      - name: Build release
        working-directory: flutter_app
        shell: bash
        run: ${{ matrix.command }}
      - name: Upload ${{ matrix.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-${{ matrix.platform }}-release
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 14

  build_apple:
    name: Build Apple platforms
    needs: validate
    # Use the documented Intel macOS 15 image as an alternate hosted-runner pool.
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Inspect Apple toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform project
        working-directory: flutter_app
        run: flutter create --platforms=ios --project-name ish_app --org com.connectapi .
      - name: Install dependencies for iOS
        working-directory: flutter_app
        run: flutter pub get
      - name: Build unsigned iOS release
        working-directory: flutter_app
        run: flutter build ios --release --no-codesign
      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-ios-release
          path: flutter_app/build/ios/iphoneos/Runner.app
          if-no-files-found: error
          retention-days: 14
      - name: Generate macOS platform project
        working-directory: flutter_app
        run: flutter create --platforms=macos --project-name ish_app --org com.connectapi .
      - name: Install dependencies for macOS
        working-directory: flutter_app
        run: flutter pub get
      - name: Build macOS release
        working-directory: flutter_app
        run: flutter build macos --release
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ish-macos-release
          path: flutter_app/build/macos/Build/Products/Release
          if-no-files-found: error
          retention-days: 14
